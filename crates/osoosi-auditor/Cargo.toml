[package]
name = "osoosi-auditor"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
regex = "1"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
walkdir = "2"

[[bin]]
name = "bulk_trainer"
path = "src/bulk_trainer.rs"

[[bin]]
name = "osoosi-auditor"
path = "src/main.rs"
