[package]
name = "osoosi-agent-anomaly"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Production Agent Anomaly Detection (AAD) engine for OpenỌ̀ṣọ́ọ̀sì EDR"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
aho-corasick = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
osoosi-types = { path = "../osoosi-types" }
osoosi-behavioral = { path = "../osoosi-behavioral" }
osoosi-policy = { path = "../osoosi-policy" }
osoosi-runtime = { path = "../osoosi-runtime" }
osoosi-telemetry = { path = "../osoosi-telemetry" }
osoosi-audit = { path = "../osoosi-audit" }
osoosi-dp = { path = "../osoosi-dp" }
osoosi-vcdb = { path = "../osoosi-vcdb" }
osoosi-memory = { path = "../osoosi-memory" }
async-trait = "0.1"
agent-thermostat = { workspace = true }
silicon-shield = { workspace = true }
zero-genesis-capacity = { workspace = true }
zero-algebraic-kernel = { workspace = true }
zero-divine-equilibrium = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
url = "2"
sysinfo = { workspace = true }
rusqlite = { workspace = true }
hostname = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = { workspace = true }
windows = { workspace = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
