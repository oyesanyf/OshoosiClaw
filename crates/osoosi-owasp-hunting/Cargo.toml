[package]
name = "osoosi-owasp-hunting"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "OWASP Hunting live threat feed sync, 41-category EDR/AppSec classification, independent outcome verification oracle, and SkyRL evaluation engine"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
blake3.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
regex.workspace = true
once_cell = "1.20"
parking_lot.workspace = true
osoosi-dp = { path = "../osoosi-dp" }
tracing = "0.1"
