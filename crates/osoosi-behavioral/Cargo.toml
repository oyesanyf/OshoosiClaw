[package]
name = "osoosi-behavioral"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Behavioral detection from system/application logs using SecureBERT-style analysis"
build = "build.rs"

[dependencies]
osoosi-types = { path = "../osoosi-types" }
osoosi-telemetry = { path = "../osoosi-telemetry" }
osoosi-dp = { path = "../osoosi-dp" }
compression-prompt = { path = "../compression-prompt" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
dashmap = "5.5"
blake3 = { workspace = true }
hostname = { workspace = true }
tokio = { workspace = true, features = ["full"] }
ort = { workspace = true }
tokenizers = "0.19"
rusqlite = { workspace = true }
ndarray = "0.16"
reqwest = { workspace = true, features = ["json", "blocking"] }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
yara-x = { workspace = true }
walkdir = { workspace = true }
# hayabusa = { workspace = true }
# chainsaw = { workspace = true }
# proc-maps = { workspace = true }
iced-x86 = { workspace = true }
sysinfo = { workspace = true }
winapi = { workspace = true }
windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
