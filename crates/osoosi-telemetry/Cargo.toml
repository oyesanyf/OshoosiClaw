[package]
name = "osoosi-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sysmon and File System Telemetry for OpenỌ̀ṣọ́ọ̀sì Agentic EDR"

[dependencies]
osoosi-types = { path = "../osoosi-types" }
osoosi-memory = { path = "../osoosi-memory" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
notify = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
hostname = { workspace = true }
sysinfo = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
zip = { workspace = true }
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation", "Win32_NetworkManagement_Ndis", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_NetShell",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_EventLog",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
wmi = "0.13"
ferrisetw = "1.2.0"
winapi = { workspace = true, features = ["namedpipeapi", "fileapi", "winbase"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true, features = ["async_tokio"] }
libc = "0.2"
