[package]
name = "osoosi-sandbox"
version.workspace = true
edition = "2021"

[dependencies]
wasmtime = { workspace = true, features = ["component-model", "async", "pooling-allocator", "wat"] }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
osoosi-types = { path = "../osoosi-types" }
osoosi-audit = { path = "../osoosi-audit" }
osoosi-memory = { path = "../osoosi-memory" }
osoosi-model = { path = "../osoosi-model" }
chrono = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
wasmtime-wasi = { workspace = true, features = ["p1", "p2"] }
cap-std = "3"
blake3 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
wat = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
