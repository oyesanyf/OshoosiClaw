[package]
name = "osoosi-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Active Response Runtime (Deception & Tarpit) for OpenỌ̀ṣọ́ọ̀sì Agentic EDR"

[dependencies]
osoosi-types = { path = "../osoosi-types" }
osoosi-sandbox = { path = "../osoosi-sandbox" }
osoosi-telemetry = { path = "../osoosi-telemetry" }
osoosi-audit = { path = "../osoosi-audit" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
rand.workspace = true
sysinfo = { workspace = true }
tfhe = { workspace = true }
bincode = { workspace = true }
dashmap = { workspace = true }
hex = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
