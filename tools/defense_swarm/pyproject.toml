[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "defense-swarm"
version = "0.1.0"
description = "LangGraph Autonomous Multi-Agent Defense Swarm for OpenỌ̀ṣọ́ọ̀sì"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
defense-swarm = "defense_swarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
