[workspace]
resolver = "2"
members = [
    "crates/osoosi-types",
    "crates/osoosi-audit",
    "crates/osoosi-memory",
    "crates/osoosi-telemetry",
    "crates/osoosi-policy",
    "crates/osoosi-model",
    "crates/osoosi-runtime",
    "crates/osoosi-wire",
    "crates/osoosi-exporter",
    "crates/osoosi-core",
    "crates/osoosi-cli",
    "crates/osoosi-trust",
    "crates/osoosi-repair",
    "crates/osoosi-dashboard",
    "crates/osoosi-sandbox",
    "crates/osoosi-behavioral", "crates/osoosi-dp",
    "crates/test-peer",
    "crates/otx-taxii-rs", "crates/osoosi-inject", "crates/osoosi-dns",
    "crates/osoosi-auditor",
    "crates/compression-prompt",
    "crates/osoosi-forensics",
    "crates/osoosi-agent-anomaly",
    "crates/osoosi-relay",
    "crates/edr-phaselock",
    "crates/agent-thermostat",
    "crates/silicon-shield",
    "crates/zero-genesis-capacity",
    "crates/zero-algebraic-kernel",
    "crates/zero-vacuum-lensing",
    "crates/zero-divine-equilibrium",
    "crates/osoosi-hexpatch",
    "crates/osoosi-owasp-hunting",
    "crates/osoosi-vcdb",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.75"

[workspace.dependencies]
osoosi-owasp-hunting = { path = "crates/osoosi-owasp-hunting" }
osoosi-vcdb = { path = "crates/osoosi-vcdb" }
edr-phaselock = { path = "crates/edr-phaselock" }
agent-thermostat = { path = "crates/agent-thermostat" }
silicon-shield = { path = "crates/silicon-shield" }
zero-genesis-capacity = { path = "crates/zero-genesis-capacity" }
zero-algebraic-kernel = { path = "crates/zero-algebraic-kernel" }
zero-vacuum-lensing = { path = "crates/zero-vacuum-lensing" }
zero-divine-equilibrium = { path = "crates/zero-divine-equilibrium" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry", "fmt"] }
tracing-appender = "0.2"
hostname = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled", "serde_json"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
# nexus-shield = { version = "0.4.4", default-features = false }
dotscope = "0.1"
wasmtime = "44.0"
iced-x86 = "1"
rand = "0.8"
rand_distr = "0.4"
fastrand = "2"
zeroize = { version = "1", features = ["derive"] }
wasmtime-wasi = "44.0"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
bytes = "1"
base64 = "0.22"
dirs = "6"
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
socket2 = "0.5"
blake3 = "1.5"
notify = "6"
libp2p = "0.57"
futures = "0.3"
quick-xml = { version = "0.28.2", features = ["serialize"] }
sysinfo = "0.30"
goblin = "0.9"
magika = "1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "download-binaries", "copy-dylibs"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
libc = "0.2"
nostr-sdk = "0.39"
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
tracing-opentelemetry = "0.34"
rayon = "1.10"
tfhe = { version = "0.6", features = ["integer", "boolean", "shortint", "seeder_x86_64_rdseed"] }
bincode = "1"
zip = "2"
sevenz-rust = { version = "0.6", features = ["aes256"] }
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
hf-hub = "0.4"
aya = "0.13"
evalexpr = "13.1.0"
ipnetwork = "0.21.1"
bloomfilter = "1.0.9"
libloading = "0.8"
yara-x = "1.19.0"
smoltcp = { version = "0.11", features = ["std", "log", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp"] }
wintun = "0.4"
managed = "0.8"
ndarray = "0.16"
parking_lot = "0.12"
wmi = "0.13"
tokenizers = "0.19"
tempfile = "3"
# Legacy tools replaced by Zero-Process Stack
# Windows-only crates — kept in workspace for version pinning;
# individual crates reference them under [target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_EventLog", "Win32_System_Restore", "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement", "Win32_Security",
    "Win32_System_Com", "Win32_System_UpdateAgent",
    "Win32_Devices_Communication", "Win32_System_Threading",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader", "Win32_Storage_FileSystem",
    "Win32_System_Memory", "Win32_System_Diagnostics_Debug",
    "Win32_Security_WinTrust", "Win32_Security_Cryptography",
    "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO", "Win32_System_Services", "Win32_System_Registry",
    "Win32_System_JobObjects",
] }
winapi = { version = "0.3", features = ["memoryapi", "processthreadsapi", "winnt", "handleapi"] }
winreg = "0.52"
pelite = "0.10"
rhai = { version = "1.26.1", features = ["sync"] }

[patch.crates-io]
wasm-bindgen-futures = { path = "crates/wasm-bindgen-futures" }
esaxx-rs = { path = "crates/esaxx-rs" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.dev.package.tfhe]
opt-level = 3

[profile.test.package.tfhe]
opt-level = 3

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true
panic = "abort"

