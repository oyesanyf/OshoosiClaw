# ──────────────────────────────────────────────────────────────
# OshoosiClaw Agent Configuration
# ──────────────────────────────────────────────────────────────
# Environment variables override any value set here.
# ──────────────────────────────────────────────────────────────

[ai]
# Enable AI features (ONNX, SmolLM, Ollama, etc.).
enabled = true

# Ordered fallback list when the primary model is not available.
fallback_models  = ["gemma3:1b", "gemma3:4b", "qwen2.5:1.5b", "phi3:mini"]

# COLOG anomaly threshold (0.0–1.0).  Events scoring above this
# trigger an anomaly alert.  Raise to reduce log noise.
colog_threshold  = 0.85

[telemetry]
# Sysmon event channel
event_channel    = "Microsoft-Windows-Sysmon/Operational"
# Polling interval (seconds)
poll_interval_secs = 1
# File system paths to watch ("all" = all drives)
watch_paths      = ["all"]

[autonomy]
# Reputation threshold (0.0–1.0). Peers ≥ this are auto-approved.
auto_approve_reputation_threshold = 0.40
# Auto-quarantine detected malware files
auto_quarantine_malware = false
# Minimum confidence (0.0–1.0) to quarantine
quarantine_confidence_threshold = 0.95
# Minimum confidence for active response (Tarpit, Deception)
action_confidence_threshold = 0.80
# Try to replace compromised binaries with clean versions
auto_replace_malware_binaries = true
# Quarantine directory
quarantine_path = "./quarantine"
# Paths excluded from quarantine (cloud sync temp folders)
quarantine_exclude_paths = [
    ".tmp.driveupload", "Google Drive", "OneDrive", "Dropbox",
    "VSCode-win32-x64", "ModelFusion\\IDE\\VSCode-win32-x64", ".vscode"
]

[runtime]
# SQLite database path for memory store
db_path = "./database/osoosi.db"
# Traps directory for deception engine
# traps_path = "./traps"

[wire]
# P2P listen address
# listen_addr = "/ip4/0.0.0.0/tcp/9000"
# Static bootstrap peers (PeerId@Multiaddr)
peers = []
# Canonical DuckDNS domain for zero-touch cross-network WAN auto-peering
duckdns_domain = "oshoosi"
auto_bootstrap_duckdns = true
duckdns_port = 4001
# Nostr Relays for decentralized threat intelligence sharing (BitChat style)
# Set to custom active relays if available, e.g. ["wss://relay.damus.io"]
nostr_relays = ["wss://relay.damus.io", "wss://nos.lol"]
# Security: If true, allows fallback to public Nostr relays if private ones are offline.
# WARNING: This may leak encrypted telemetry metadata to public servers.
allow_public_relays = true

[backup]
# Enable backup on agent start
enabled = false
# Backup type: "restore_point" (Win), "file_sync" (all), "full_image" (Win)
backup_type = "file_sync"

[repair]
# Enable automatic repair/patching
# enabled = true

[sandbox]
# Maximum host calls per WASM session
max_host_calls_per_session = 256

[external_api]
# AlienVault OTX API key (env: OTX_API_KEY)
# otx_api_key = ""
# NVD API key (env: NVD_API_KEY)
# nvd_api_key = ""

# Paths to exclude from ALL scanning (suppresses all voters)
consensus_exclude_paths = [
    "D:\\harfile\\OshoosiClaw\\traps", 
    "C:\\Windows\\Temp", 
    "D:\\backup",
    "D:\\harfile\\ModelFusion\\IDE\\VSCode-win32-x64",
    "VSCode-win32-x64"
]

# Path substrings to consider 'trusted' (caps confidence at 0.15)
consensus_trusted_paths = [
    "\\OshoosiClaw\\target\\", 
    "\\OshoosiClaw\\tools\\",
    "\\ModelFusion\\IDE\\VSCode-win32-x64\\",
    "\\VSCode-win32-x64\\",
    "\\.vscode\\"
]

# Process stems to suppress (caps confidence at 0.15)
consensus_noisy_stems = [
    "git", "rustc", "cargo", "node", "python", "code", "cursor",
    "vulkan-1.dll", "msalruntime.dll", "msal-node-runtime.node", "vsda.node",
    "win32-app-container-tokens", "win32-app-container-tokens.node"
]

# --- DYNAMIC TRUST LISTS ---
# Binaries matching these will NEVER be autonomously blocked if they are signed (verified on-disk).
trusted_paths = [
    "\\windows\\system32", 
    "\\windows\\syswow64", 
    "\\windows\\servicing", 
    "\\windows\\winsxs", 
    "\\.rustup\\", 
    "\\.cargo\\", 
    "\\program files\\git\\", 
    "\\tools\\git\\",
    "\\ModelFusion\\IDE\\VSCode-win32-x64\\",
    "\\VSCode-win32-x64\\",
    "\\.vscode\\"
]
trusted_stems = [
    "Sysmon64.exe", "git.exe", "rustc.exe", "cargo.exe", "rustup.exe", "clippy-driver.exe", 
    "cargo-clippy.exe", "cargo-fmt.exe", "svchost.exe", "conhost.exe", 
    "wermgr.exe", "wmic.exe", "where.exe", "wmiprvse.exe",
    "vulkan-1.dll", "msalruntime.dll", "msal-node-runtime.node", "vsda.node",
    "win32-app-container-tokens", "win32-app-container-tokens.node"
]

# Alert suppression period in seconds (10 minutes)
alert_suppression_secs = 600

[skills]
# Enable WikiSkill autonomous self-evolving agent skill engine
enabled = true
# Automatically start background self-evolution loop on EDR daemon startup
auto_evolve_on_start = true
# Designated evolution workspace
workspace = "runs/edr-evolution"
# Ground truth tasks catalog
tasks_file = "examples/edr-skill-evolution/tasks.json"
# Ground truth evaluation scorer
scorer = "examples/edr-skill-evolution/scorer.py"
# Re-evaluation and learning interval in seconds (5 minutes)
poll_interval_secs = 300

[forensics]
# Enable embedded Velociraptor forensic extraction service
enabled = true
# Standalone headless executable path
binary_path = "tools/velociraptor/velociraptor.exe"
# Per-query execution hard timeout in seconds
execution_timeout_secs = 30
# Memory cap for headless forensic runner in MB
max_memory_mb = 512
# Max output lines streamed from VQL queries before applying backpressure cut
max_output_lines = 10000
# Forensic staging and artifact capture directory
staging_dir = "runs/forensics"
# Automatically trigger deep forensic sweeps on high-confidence alerts
auto_investigate = true
# Minimum alert confidence required to trigger automatic forensic sweep
min_trigger_confidence = 0.80
# MITRE ATT&CK techniques eligible for automatic forensic deep inspection
trigger_techniques = ["T1055", "T1055.012", "T1003", "T1014", "T1547", "T1059"]

[decision_model]
enabled = true
# Provider: "hybrid" (combines Clef Flash & Strands Decider), "local", or "cloudflare"
provider = "hybrid"
# Hybrid routing strategy: "cascade", "consensus", or "local_first"
hybrid_strategy = "cascade"
# Cloudflare Clef Settings (Tier 2 Edge)
model = "@cf/cloudflare/clef-flash"
cloudflare_account_id = ""
cloudflare_api_token = ""
timeout_ms = 500
# Strands Decider 2B Settings (Tier 3 Local Open Source SLM)
strands_endpoint = "http://127.0.0.1:4003"
strands_model = "StrandsAgents/strands-decider-2B-hobson-v19"
strands_timeout_ms = 800
fallback_to_local = true
min_action_confidence = 0.80
auto_escalate_to_cortex = true
# Path to local weights / calibration tables (operates 100% self-hosted / air-gapped)
model_dir = "models/clef"

[swarm]
# Enable LangGraph Autonomous Defense Swarm
enabled = true
# LangGraph Swarm Service REST API endpoint
service_url = "http://127.0.0.1:4002"
# Automatically dispatch incidents to Swarm on high-confidence detection
auto_trigger_on_threat = true
# Minimum threat confidence to trigger deep swarm investigation
min_trigger_confidence = 0.85
# Swarm webhook timeout in seconds
timeout_secs = 30

[resources]
# Hardware tier profile: "auto", "ultralite", "lite", "standard", "enterprise"
profile = "auto"
# Minimum free RAM (MB) required to launch external web browser process
min_free_ram_mb_for_browser = 2500
# Minimum free RAM (MB) thresholds for specific models
min_free_ram_mb_for_foundation_sec = 8192
min_free_ram_mb_for_strands_decider = 3500
min_free_ram_mb_for_securebert = 800
min_free_ram_mb_for_sorel = 350
min_free_ram_mb_for_malconv = 150
# Protect host responsiveness by suppressing browser & heavy models on low RAM
auto_suppress_browser_on_low_ram = true
auto_throttle_ai_on_low_ram = true



