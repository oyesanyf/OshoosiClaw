name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Clippy: zero warnings policy ─────────────────────────────────────────────
  clippy:
    name: Clippy (zero warnings)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: clippy-windows

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::double_must_use

  # ── cargo-audit: dependency vulnerability scan ────────────────────────────────
  audit:
    name: Dependency Audit (cargo-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.49.45
        with:
          tool: cargo-audit

      - name: Run audit
        run: cargo audit --ignore RUSTSEC-2026-0387

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: test-windows

      - name: Run tests
        env:
          OSOOSI_NO_ORT: "1"   # skip ORT download in CI
          OSOOSI_NO_AI: "1"
        run: cargo test --workspace

      - name: Run Multi-Node GossipSub Fault-Injection Benchmark
        run: python scripts/run_multi_node_mesh_benchmark.py --fast
        env:
          OSOOSI_NO_ORT: "1"
          OSOOSI_NO_AI: "1"

      - name: Upload Fault-Injection Benchmark Report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: mesh-fault-injection-report
          path: logs/multi_node_mesh_benchmark_report.json

      - name: Launch live daemon and run 43-vector proof suite
        shell: powershell
        run: |
          $env:OSOOSI_DASHBOARD_PORT = "3030"
          $env:OSOOSI_DASHBOARD_BIND_ALL = "1"
          $env:OSOOSI_NO_ORT = "1"
          $env:OSOOSI_NO_AI = "1"

          # Pre-build dashboard test binary before background execution
          cargo test --no-run -p osoosi-dashboard --test port3030_daemon

          # Start daemon in background
          $daemonJob = Start-Job -ScriptBlock {
            cargo test -p osoosi-dashboard --test port3030_daemon run_live_port_3030_daemon -- --nocapture
          }

          # Wait for port 3030 to respond
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:3030/api/status" -TimeoutSec 2 -UseBasicParsing
              if ($resp.StatusCode -eq 200) {
                Write-Host "Live dashboard daemon ready on port 3030"
                $ready = $true
                break
              }
            } catch {
              # Not ready yet
            }
          }

          if (-not $ready) {
            Write-Host "Daemon failed to start or bind port 3030"
            Receive-Job $daemonJob
            Stop-Job $daemonJob
            exit 1
          }

          # Execute 43-vector multi-trial proof runner
          python -u scripts/run_live_adversarial_proof_suite.py --url http://127.0.0.1:3030 --trials 3
          $suiteExit = $LASTEXITCODE

          # Stop daemon job
          Stop-Job $daemonJob
          Remove-Job $daemonJob -Force

          exit $suiteExit

      - name: Upload Adversarial Proof Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: adversarial-proof-report
          path: |
            logs/adversarial_proof_report.json
            logs/adversarial_proof_report.md

  # ── Live Multi-Trial CI Verification on Port 3030 (R5) ───────────────────────
  live-verification:
    name: Live Multi-Trial Port 3030 Verification
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: live-verification-windows

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-build Dashboard Test Binary
        shell: bash
        env:
          OSOOSI_NO_ORT: "1"
          OSOOSI_NO_AI: "1"
        run: cargo test --no-run -p osoosi-dashboard

      - name: Run Live Multi-Trial CI Suite (6-Vector Breakout + 15-Vector Gauntlet)
        env:
          OSOOSI_DASHBOARD_PORT: "3030"
          OSOOSI_DASHBOARD_BIND_ALL: "1"
          OSOOSI_NO_ORT: "1"
          OSOOSI_NO_AI: "1"
        run: python -u scripts/run_live_multi_trial_suite.py --port 3030 --trials 3 --suite all --daemon-timeout 300

      - name: Upload Live Multi-Trial Verification Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: live-multi-trial-report
          path: |
            logs/live_multi_trial_report.json
            logs/live_multi_trial_report.md

  # ── Format check ─────────────────────────────────────────────────────────────
  fmt:
    name: Format Check (rustfmt)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Secret scan ───────────────────────────────────────────────────────────────
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0   # full history for secret detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
