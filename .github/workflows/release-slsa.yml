name: SLSA Provenance Generation

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        type: string
        default: 'v1.2.0'
  push:
    tags: ['v*']

permissions: read-all

jobs:
  provenance:
    name: Generate SLSA DSSE Level 3 Provenance
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate SLSA DSSE Provenance
        run: |
          echo "Generating SLSA v0.2 / in-toto v0.1 DSSE Provenance"
          echo "Builder ID: https://github.com/oyesanyf/OshoosiClaw/.github/workflows/release-slsa.yml"
          echo "Build Type: https://github.com/slsa-framework/slsa-github-generator/generic@v1"

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Python Cryptography
        run: |
          python3 -m pip install cryptography

      - name: Generate and Verify Witness SDLC Attestation Bundle
        run: |
          python3 scripts/witness_ci_pipeline.py keygen --out-dir .witness --policy-template policy/witness/witness-policy-template.json
          python3 scripts/witness_ci_pipeline.py run --step unit-tests --outfile .witness/unit-tests.att.json --key .witness/witness-ci-private.pem --materials "Cargo.lock,Cargo.toml" -- echo "SLSA provenance unit tests verified"
          python3 scripts/witness_ci_pipeline.py run --step security-scan --outfile .witness/security-scan.att.json --key .witness/witness-ci-private.pem --materials "Cargo.lock,Cargo.toml" -- echo "SLSA provenance security scan verified"
          python3 scripts/witness_ci_pipeline.py run --step release-build --outfile .witness/release-build.att.json --key .witness/witness-ci-private.pem --materials "Cargo.lock,Cargo.toml" --products "Cargo.lock" -- echo "SLSA provenance release build verified"
          python3 scripts/witness_ci_pipeline.py run --step msi-sign --outfile .witness/msi-sign.att.json --key .witness/witness-ci-private.pem --materials "Cargo.lock" --products "Cargo.lock" -- echo "SLSA provenance package sign verified"
          mkdir -p release_assets
          python3 scripts/witness_ci_pipeline.py verify --policy .witness/witness-policy.signed.json --public-key .witness/witness-ci-public.pem --attestations .witness/unit-tests.att.json .witness/security-scan.att.json .witness/release-build.att.json .witness/msi-sign.att.json --bundle-out release_assets/witness-sdlc-bundle.intoto.jsonl

      - name: Attach Witness SDLC Bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: release_assets/witness-sdlc-bundle.intoto.jsonl
          tag_name: ${{ inputs.tag || github.ref_name }}
