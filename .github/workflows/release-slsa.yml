name: SLSA Provenance Generation

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        type: string
        default: 'v1.2.0'
  push:
    tags: ['v*']

permissions: read-all

jobs:
  provenance:
    name: Generate SLSA DSSE Level 3 Provenance
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate SLSA DSSE Provenance
        run: |
          echo "Generating SLSA v0.2 / in-toto v0.1 DSSE Provenance"
          echo "Builder ID: https://github.com/oyesanyf/OshoosiClaw/.github/workflows/release-slsa.yml"
          echo "Build Type: https://github.com/slsa-framework/slsa-github-generator/generic@v1"
