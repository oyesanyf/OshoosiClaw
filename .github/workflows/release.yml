name: Cross-Platform Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated targets to build (leave empty for all)'
        required: false
        default: ''

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Windows native MSVC ──────────────────────────────────────────────────────
  build-windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: windows-msvc

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: osoosi-windows-x64
          path: target/x86_64-pc-windows-msvc/release/osoosi.exe
          if-no-files-found: error

  # ── Linux x86_64 musl (zero-dependency static binary) ───────────────────────
  build-linux-x64:
    name: Linux x64 (musl static)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install cross
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.49.45
        with:
          tool: cross

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: linux-musl-x64

      - name: Build release (static musl)
        run: cross build --release --target x86_64-unknown-linux-musl

      - name: Package Linux x64 artifacts (.deb, .tar.gz)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="1.2.0"; fi
          bash packaging/linux/build_packages.sh target/x86_64-unknown-linux-musl/release/osoosi "${VERSION}" amd64 dist-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: osoosi-linux-x64-musl
          path: target/x86_64-unknown-linux-musl/release/osoosi
          if-no-files-found: error

      - name: Upload Linux x64 packages
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: osoosi-linux-x64-packages
          path: dist-linux-x64/*
          if-no-files-found: error

  # ── Linux ARM64 musl (Raspberry Pi, AWS Graviton, cloud ARM) ────────────────
  build-linux-arm64:
    name: Linux ARM64 (musl static)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.49.45
        with:
          tool: cross

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: linux-musl-arm64

      - name: Build release (static ARM64 musl)
        run: cross build --release --target aarch64-unknown-linux-musl

      - name: Package Linux ARM64 artifacts (.deb, .tar.gz)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="1.2.0"; fi
          bash packaging/linux/build_packages.sh target/aarch64-unknown-linux-musl/release/osoosi "${VERSION}" arm64 dist-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: osoosi-linux-arm64-musl
          path: target/aarch64-unknown-linux-musl/release/osoosi
          if-no-files-found: error

      - name: Upload Linux ARM64 packages
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: osoosi-linux-arm64-packages
          path: dist-linux-arm64/*
          if-no-files-found: error

  # ── macOS Intel ──────────────────────────────────────────────────────────────
  build-macos-intel:
    name: macOS Intel (x86_64)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: macos-intel

      - name: Build release
        run: cargo build --release --target x86_64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: osoosi-macos-intel
          path: target/x86_64-apple-darwin/release/osoosi
          if-no-files-found: error

  # ── macOS Apple Silicon ───────────────────────────────────────────────────────
  build-macos-arm:
    name: macOS Apple Silicon (aarch64)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: macos-arm

      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: osoosi-macos-arm64
          path: target/aarch64-apple-darwin/release/osoosi
          if-no-files-found: error

  # ── SLSA Provenance Attestation & GitHub Release ─────────────────────────────
  release:
    name: Generate SLSA Build Provenance & GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          path: dist/

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-path: 'dist/**/osoosi*'

      - name: Stage Release Assets
        run: |
          mkdir -p release_assets
          find dist/ -type f \( -name "*.deb" -o -name "*.tar.gz" -o -name "*.rpm" -o -name "*.exe" -o -name "osoosi" \) -exec cp {} release_assets/ \;
          cp packaging/linux/osoosi-edr.service release_assets/
          if [ -f PUBLIC_KEY.asc ]; then cp PUBLIC_KEY.asc release_assets/; fi
          ls -la release_assets/

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: release_assets/*
          draft: false
          prerelease: false

  # ── Container Packaging to GHCR ──────────────────────────────────────────────
  package-container:
    name: Package & Publish Container (GHCR)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: osoosi-linux-x64-musl
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
