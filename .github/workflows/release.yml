name: Cross-Platform Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated targets to build (leave empty for all)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Windows native MSVC ──────────────────────────────────────────────────────
  build-windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osoosi-windows-x64
          path: target/x86_64-pc-windows-msvc/release/osoosi.exe
          if-no-files-found: error

  # ── Linux x86_64 musl (zero-dependency static binary) ───────────────────────
  build-linux-x64:
    name: Linux x64 (musl static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl-x64

      - name: Build release (static musl)
        run: cross build --release --target x86_64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osoosi-linux-x64-musl
          path: target/x86_64-unknown-linux-musl/release/osoosi
          if-no-files-found: error

  # ── Linux ARM64 musl (Raspberry Pi, AWS Graviton, cloud ARM) ────────────────
  build-linux-arm64:
    name: Linux ARM64 (musl static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl-arm64

      - name: Build release (static ARM64 musl)
        run: cross build --release --target aarch64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osoosi-linux-arm64-musl
          path: target/aarch64-unknown-linux-musl/release/osoosi
          if-no-files-found: error

  # ── macOS Intel ──────────────────────────────────────────────────────────────
  build-macos-intel:
    name: macOS Intel (x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-intel

      - name: Build release
        run: cargo build --release --target x86_64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osoosi-macos-intel
          path: target/x86_64-apple-darwin/release/osoosi
          if-no-files-found: error

  # ── macOS Apple Silicon ───────────────────────────────────────────────────────
  build-macos-arm:
    name: macOS Apple Silicon (aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm

      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osoosi-macos-arm64
          path: target/aarch64-apple-darwin/release/osoosi
          if-no-files-found: error

  # ── Create GitHub Release with all binaries ───────────────────────────────────
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/osoosi-windows-x64/osoosi.exe
            dist/osoosi-linux-x64-musl/osoosi
            dist/osoosi-linux-arm64-musl/osoosi
            dist/osoosi-macos-intel/osoosi
            dist/osoosi-macos-arm64/osoosi
          generate_release_notes: true
