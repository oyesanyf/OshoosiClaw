name: ClusterFuzzLite Continuous Fuzzing

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: read-all

jobs:
  Fuzzing:
    name: ClusterFuzzLite (Rust LibFuzzer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@97b30d984674d2cde3c6331e17ae6475b8c18e64 # master
        with:
          language: rust
          dry-run: true

      - name: Run Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@97b30d984674d2cde3c6331e17ae6475b8c18e64 # master
        with:
          language: rust
          fuzz-seconds: 60
          dry-run: true
