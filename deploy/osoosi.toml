# ──────────────────────────────────────────────────────────────
# OshoosiClaw Agent Configuration
# ──────────────────────────────────────────────────────────────
# Environment variables override any value set here.
# ──────────────────────────────────────────────────────────────

[ai]
# Enable AI features (ONNX, SmolLM, Ollama, etc.).
enabled = true

# Ordered fallback list when the primary model is not available.
fallback_models  = ["gemma3:1b", "gemma3:4b", "qwen2.5:1.5b", "phi3:mini"]

# COLOG anomaly threshold (0.0–1.0).  Events scoring above this
# trigger an anomaly alert.  Raise to reduce log noise.
colog_threshold  = 0.85

[telemetry]
# Sysmon event channel
event_channel    = "Microsoft-Windows-Sysmon/Operational"
# Polling interval (seconds)
poll_interval_secs = 1
# File system paths to watch ("all" = all drives)
watch_paths      = ["all"]

[autonomy]
# Reputation threshold (0.0–1.0). Peers ≥ this are auto-approved.
auto_approve_reputation_threshold = 0.4
# Auto-quarantine detected malware files
auto_quarantine_malware = false
# Minimum confidence (0.0–1.0) to quarantine
quarantine_confidence_threshold = 0.95
# Minimum confidence for active response (Tarpit, Deception)
action_confidence_threshold = 0.80
# Try to replace compromised binaries with clean versions
auto_replace_malware_binaries = true
# Quarantine directory
quarantine_path = "./quarantine"
# Paths excluded from quarantine (cloud sync temp folders)
quarantine_exclude_paths = [".tmp.driveupload", "Google Drive", "OneDrive", "Dropbox"]

[runtime]
# SQLite database path for memory store
db_path = "./database/osoosi.db"
# Traps directory for deception engine
# traps_path = "./traps"

[wire]
# P2P listen address
# listen_addr = "/ip4/0.0.0.0/tcp/9000"
# Static bootstrap peers (PeerId@Multiaddr)
peers = []
# Nostr Relays for decentralized threat intelligence sharing (BitChat style)
nostr_relays = ["ws://localhost:8080"]
# Security: If true, allows fallback to public Nostr relays if private ones are offline.
# WARNING: This may leak encrypted telemetry metadata to public servers.
allow_public_relays = true

[backup]
# Enable backup on agent start
enabled = false
# Backup type: "restore_point" (Win), "file_sync" (all), "full_image" (Win)
backup_type = "file_sync"

[repair]
# Enable automatic repair/patching
# enabled = true

[sandbox]
# Maximum host calls per WASM session
max_host_calls_per_session = 256

[external_api]
# AlienVault OTX API key (env: OTX_API_KEY)
# otx_api_key = ""
# NVD API key (env: NVD_API_KEY)
# nvd_api_key = ""

# Paths to exclude from ALL scanning (suppresses all voters)
consensus_exclude_paths = ["D:\\harfile\\OshoosiClaw\\traps", "C:\\Windows\\Temp", "D:\\backup"]

# Path substrings to consider 'trusted' (caps confidence at 0.15)
consensus_trusted_paths = ["\\OshoosiClaw\\target\\", "\\OshoosiClaw\\tools\\"]

# Process stems to suppress (caps confidence at 0.15)
consensus_noisy_stems = ["git", "rustc", "cargo", "node", "python", "code", "cursor"]

# --- DYNAMIC TRUST LISTS ---
# Binaries matching these will NEVER be autonomously blocked if they are signed (verified on-disk).
trusted_paths = [
    "\\windows\\system32", 
    "\\windows\\syswow64", 
    "\\windows\\servicing", 
    "\\windows\\winsxs", 
    "\\.rustup\\", 
    "\\.cargo\\", 
    "\\program files\\git\\", 
    "\\tools\\git\\"
]
trusted_stems = [
    "Sysmon64.exe", "git.exe", "rustc.exe", "cargo.exe", "rustup.exe", "clippy-driver.exe", 
    "cargo-clippy.exe", "cargo-fmt.exe", "svchost.exe", "conhost.exe", 
    "wermgr.exe", "wmic.exe", "where.exe", "wmiprvse.exe"
]

# Alert suppression period in seconds (10 minutes)
alert_suppression_secs = 600
